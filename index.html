<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARTIC Market | Enter Details</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2B9348',
                        primaryDark: '#1E6F34',
                        accent: '#F9A826',
                        dark: '#222222'
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif'],
                        headingNew: ['Outfit', 'sans-serif'],
                        bodyNew: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- GSAP for Smooth Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        html {
            font-size-adjust: 0.52;
        }

        :root {
            --green: #16a34a; 
            --green-light: #22c55e;
            --ink: #0f1a0d;
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: #FFFFFF;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-tap-highlight-color: transparent;
        }

        /* Mobile specific full-screen adjustments */
        @media (max-width: 1023px) {
            .mobile-full-screen {
                min-height: 100dvh;
                min-height: -webkit-fill-available;
            }
        }

        /* Desktop Box Shadow */
        @media (min-width: 1024px) {
            .desktop-box-shadow {
                box-shadow: 0 18px 40px rgba(0,0,0,.18);
            }
        }

        /* =========================================
           GPU Promotion & Initial States
           ========================================= */
        section {
            will-change: transform, opacity;
            transform: translateZ(0);
        }

        .form-stagger { 
            opacity: 0; 
            will-change: transform, opacity;
        }

        /* =========================================
           New Custom Input & Glow Styles 
           (Added Auto-Zoom / Input Zoom Feature)
           ========================================= */
        .field-inner {
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s, transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            background: #f8faf8;
            border: 1px solid #e5e7eb;
            border-radius: 0.75rem; 
        }

        .field-inner:focus-within { 
            border-color: var(--green-light); 
            background: #fff; 
            box-shadow: 0 0 0 4px rgba(34,197,94,0.1); 
            transform: scale(1.02); /* Slight scale on desktop */
        }

        /* Emphasized Auto-Zoom Input Feature specifically for Mobile screens */
        @media (max-width: 1023px) {
            .form-stagger:focus-within {
                position: relative;
                z-index: 10;
            }
            .field-inner:focus-within {
                transform: scale(1.045);
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 0 0 4px rgba(34,197,94,0.15);
            }
        }

        .field-icon {
            color: #9ca3af; 
            transition: color 0.2s;
        }

        .field-inner:focus-within .field-icon,
        .field-inner:has(.custom-input:not(:placeholder-shown)) .field-icon {
            color: var(--green);
        }

        .custom-input {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 16px;
            font-size-adjust: none; /* Ensures strict computed 16px to control unwanted native iOS viewport zoom */
            touch-action: manipulation; /* Optimizes mobile tap interactions */
            font-weight: 600;
            color: var(--ink);
            letter-spacing: 0.01em;
            background: transparent;
            border: none;
            outline: none;
            width: 100%;
        }

        @media (min-width: 640px) {
            .custom-input {
                font-size: 17.5px;
            }
        }

        .custom-input::placeholder {
            color: #9ca3af;
            font-weight: 400;
        }

        /* =========================================
           Tick Animation Styles
           ========================================= */
        .field-check {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--green-light);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0; 
            transition: opacity 0.2s ease-in-out; 
            flex-shrink: 0;
        }

        .field-check.visible {
            opacity: 1;
        }

        .field-check svg {
            color: white;
            width: 10px;
            height: 10px;
        }

        /* =========================================
           CTA Button Styling
           ========================================= */
        .cta-btn {
            position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: space-between;
            background-color: #0c0c0c; color: #ffffff;
            padding: 0.5rem 0.5rem 0.5rem 2rem; border-radius: 9999px;
            font-size: 0.95rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
            border: none; cursor: pointer; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            width: 100%;
        }
        .cta-btn:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25), 0 0 0 6px rgba(0, 0, 0, 0.05) !important; 
        }
        .cta-btn:active { transform: translateY(1px); }
        .cta-btn::before {
            content: ''; position: absolute; top: 0; left: -150%; width: 150%; height: 100%;
            background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.15) 50%, transparent 100%);
            transform: skewX(-20deg); transition: left 0.7s cubic-bezier(0.16, 1, 0.3, 1); z-index: 0;
        }
        .cta-btn:hover::before { left: 150%; }
        .btn-text { position: relative; z-index: 1; text-align: center; width: 100%; padding-right: 1rem; }

        .arrow-wrapper {
            position: relative; z-index: 1; display: flex; align-items: center; justify-content: center;
            width: 42px; height: 42px; border-radius: 50%; background-color: #ffffff; color: #0c0c0c; 
            overflow: hidden; flex-shrink: 0;
        }
        .arrow-1 { display: flex; align-items: center; justify-content: center; transition: transform 0.3s ease; }
        .cta-btn:hover .arrow-1 { transform: translateX(3px); }

        /* =========================================
           Back Button Styles
           ========================================= */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.625rem;
            color: #6b7280;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            width: max-content;
            transition: all 0.3s ease;
        }
        .back-btn:hover {
            color: #111827;
        }
        .icon-circle {
            width: 2.25rem;
            height: 2.25rem;
            border-radius: 50%;
            background-color: #f3f4f6;
            border: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s ease;
        }
        .back-btn:hover .icon-circle {
            background-color: #e5e7eb;
        }
        .back-btn .btn-text {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.025em;
            width: auto;
            padding-right: 0;
        }
    </style>
</head>
<body class="text-dark bg-white lg:bg-gray-900 overflow-x-hidden">

    <main class="flex flex-col min-h-[100dvh] w-full relative lg:items-center lg:justify-center">
        
        <!-- ================= BACKGROUND IMAGE (DESKTOP ONLY) ================= -->
        <div class="hidden lg:block absolute inset-0 w-full h-full z-0 overflow-hidden">
            <div class="w-full h-full bg-[url('https://images.unsplash.com/photo-1542838132-92c53300491e?q=80&w=2000&auto=format&fit=crop')] bg-cover bg-center"></div>
            <div class="absolute inset-0 bg-black/60 z-10"></div>
            
            <div class="absolute top-10 left-10 z-20 flex items-center gap-2.5">
                <div class="w-10 h-10 bg-primary/90 backdrop-blur-md rounded-xl flex items-center justify-center shadow-lg border border-white/10">
                    <span class="text-white font-heading font-bold text-2xl leading-none">A</span>
                </div>
                <span class="text-white font-heading font-bold text-xl tracking-tight drop-shadow-md">ARTIC Market.</span>
            </div>
        </div>

        <!-- ================= CENTERED FORM BOX ================= -->
        <section class="relative w-full bg-white z-10 
                        mobile-full-screen flex flex-col justify-start p-6 sm:p-10 
                        lg:w-[540px] lg:min-h-[720px] lg:justify-center lg:rounded-[40px] lg:p-[1.7rem] desktop-box-shadow">
            
            <div class="w-full max-w-[480px] mx-auto flex flex-col relative pt-[env(safe-area-inset-top)] pb-[env(safe-area-inset-bottom)] lg:pt-0 lg:pb-0">
                
                <!-- Back Button -->
                <div class="form-stagger mb-8 mt-2 lg:mt-0">
                    <button type="button" class="back-btn" onclick="window.location.href='index.html'">
                        <div class="icon-circle">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M19 12H5"></path>
                                <path d="M12 19l-7-7 7-7"></path>
                            </svg>
                        </div>
                        <span class="btn-text">Back</span>
                    </button>
                </div>

                <!-- Form Heading -->
                <div class="form-stagger mb-10 flex flex-col items-center text-center">
                    <h2 class="font-headingNew text-[36px] sm:text-[40px] md:text-[40px] font-black leading-tight tracking-tight mb-2">
                        <span class="text-[#22c55e]">Secure</span> <span class="text-gray-900">Your Spot.</span>
                    </h2>
                    <p class="font-bodyNew text-[15px] sm:text-[16px] md:text-[17px] text-gray-500 leading-relaxed max-w-[420px] md:max-w-[36rem] mx-auto">
                        Enter your details below to claim your lifetime wholesale access
                    </p>
                </div>

                <!-- Registration Form -->
                <form action="#" method="POST" class="space-y-6">
                    
                    <!-- Name Input -->
                    <div class="form-stagger space-y-2">
                        <label for="name" class="block font-bodyNew font-bold text-gray-700 uppercase text-[12px] lg:text-[13px]">Full Name</label>
                        <div class="field-inner relative flex items-center px-4 py-3.5">
                            <span class="field-icon mr-3 pr-3 border-r border-gray-300 flex-shrink-0">
                                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                            </span>
                            <input type="text" id="name" name="name" required placeholder="Your Name" class="custom-input">
                        </div>
                    </div>

                    <!-- Phone Number Input -->
                    <div class="form-stagger space-y-2">
                        <label for="phone" class="block font-bodyNew font-bold text-gray-700 uppercase text-[12px] lg:text-[13px]">Phone Number</label>
                        <div class="field-inner relative flex items-center">
                            <span class="absolute left-4 text-gray-500 font-bodyNew font-semibold flex items-center gap-1.5 border-r border-gray-300 pr-3 pointer-events-none">
                                🇮🇳 +91
                            </span>
                            <input type="tel" id="phone" name="phone" required placeholder="Your number" 
                                pattern="[0-9]{10}" maxlength="10"
                                oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10); document.getElementById('phone-check').classList.toggle('visible', this.value.length === 10);"
                                class="custom-input pl-[85px] pr-10 py-3.5">
                            
                            <!-- Tick Animation Container -->
                            <div id="phone-check" class="field-check">
                                <svg fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                                    <path d="M20 6L9 17l-5-5"/>
                                </svg>
                            </div>
                        </div>
                    </div>

                    <!-- Location Input -->
                    <div class="form-stagger space-y-2">
                        <label for="location" class="block font-bodyNew font-bold text-gray-700 uppercase text-[12px] lg:text-[13px]">City</label>
                        <div class="field-inner relative flex items-center px-4 py-3.5">
                            <span class="field-icon mr-3 pr-3 border-r border-gray-300 flex-shrink-0">
                                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                            </span>
                            <input type="text" id="location" name="location" required placeholder="e.g. Rajapalayam" class="custom-input">
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <div class="form-stagger pt-4">
                        <button type="submit" class="cta-btn">
                            <span class="btn-text">Confirm Registration</span>
                            <span class="arrow-wrapper">
                                <span class="arrow-1">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
                                </span>
                            </span>
                        </button>
                    </div>

                    <div class="form-stagger text-center pt-2">
                        <p class="text-[12px] text-gray-400 font-bodyNew font-medium flex items-center justify-center gap-1.5">
                            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24" style="color: var(--green-light); flex-shrink: 0;"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                            Your data is secure and will never be shared.
                        </p>
                    </div>

                </form>
            </div>
        </section>
    </main>

    <!-- GSAP Animations Logic -->
    <script>
        window.addEventListener('load', () => {
            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            if (prefersReducedMotion) {
                gsap.set('.form-stagger, section', { opacity: 1, y: 0 });
                return;
            }

            gsap.set("section", { opacity: 1 });
            gsap.set(".form-stagger", { opacity: 0, y: 16 });

            requestAnimationFrame(() => {
                gsap.to(".form-stagger", {
                    opacity: 1,
                    y: 0,
                    stagger: 0.08,
                    duration: 0.55,
                    ease: "power2.out"
                });
            });
        });
    </script>
</body>
</html>
